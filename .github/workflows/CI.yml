name: Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Replaces microsoft/action-python@0.7.3, whose pinned Python 3.11.3 no longer
# exists on the ubuntu-latest runner (every job failed at setup-python). Its
# publish job pushed an RC to PyPI on every push to main; fluxpype has never
# reached PyPI, so publishing is left to the manual publish.yml.

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plumber,mcp]" pytest pytest-cov
      - name: pytest
        run: python -m pytest -q

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "black==26.5.1"
      - run: |
          set -o pipefail
          black --check --diff . | tail -n 50
