name: Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Replaces microsoft/action-python@0.7.3, whose pinned Python 3.11.3 no longer
# exists on the ubuntu-latest runner (every job failed at setup-python). Its
# publish job pushed an RC to PyPI on every push to main; fluxpype has never
# reached PyPI, so publishing is left to the manual publish.yml.

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plumber,mcp]" pytest pytest-cov
      - name: pytest
        run: python -m pytest -q
      # One upload per push to main, from the newest job, so the token never
      # reaches code from a pull request. It never fails the build: until the
      # CODECOV_TOKEN secret exists the upload is skipped with a warning.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "black==26.5.1"
      - run: |
          set -o pipefail
          black --check --diff . | tail -n 50
